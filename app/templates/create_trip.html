{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Plan a New Trip</h3>
                <form method="POST" action="{{ url_for('auth.create_trip') }}">
                    <div class="mb-3">
                        <label for="title" class="form-label">Trip Title</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="e.g., Summer in Europe" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="start_date" name="start_date" required>
                        </div>
                        <div class="col">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="end_date" name="end_date" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="description" class="form-label">Description (Optional)</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="What is the goal of this trip?"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Save Trip</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
