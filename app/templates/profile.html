{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-primary text-white text-center py-4">
                <div class="display-1 mb-2">👤</div>
                <h2 class="mb-0">{{ current_user.username }}</h2>
                <p class="text-light mb-0">{{ current_user.email }}</p>
            </div>
            
            <div class="card-body p-5">
                <h4 class="text-muted mb-4 border-bottom pb-2">Travel Statistics</h4>
                
                <div class="row text-center">
                    <div class="col-6 border-end">
                        <h1 class="display-4 text-primary">{{ total_trips }}</h1>
                        <p class="text-muted text-uppercase fw-bold">Total Trips</p>
                    </div>
                    <div class="col-6">
                        <h1 class="display-4 text-success">{{ total_cities }}</h1>
                        <p class="text-muted text-uppercase fw-bold">Cities Visited</p>
                    </div>
                </div>
                
                <div class="mt-5 text-center">
                    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-outline-primary w-50">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
