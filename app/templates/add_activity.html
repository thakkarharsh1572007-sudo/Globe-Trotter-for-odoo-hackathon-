{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Add Activity in {{ stop.city_name }}</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Activity Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g., Museum Tour" required>
                    </div>
                    <div class="mb-3">
                        <label for="cost" class="form-label">Estimated Cost (₹)</label>
                        <input type="number" step="1" class="form-control" id="cost" name="cost" placeholder="0.00">
                    </div>
                    <div class="mb-4">
                        <label for="activity_date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="activity_date" name="activity_date" 
                               min="{{ stop.arrival_date }}" max="{{ stop.departure_date }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Activity</button>
                    <a href="{{ url_for('auth.trip_view', trip_id=stop.trip_id) }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
